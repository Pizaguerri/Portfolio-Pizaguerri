<!doctype html>
{{- $theme := .Params.theme | default .Site.Params.defaultTheme }}

<script>
  (function() {
    // Verifica si hay una preferencia guardada en localStorage
    const storedTheme = localStorage.getItem('theme');
    
    if (storedTheme) {
      // Preferir elección del usuario sobre sistema
      if (storedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      // Si no hay elección guardada, usar preferencia del sistema
      document.documentElement.classList.add('dark');
    }
  })();
</script>

<html lang="{{ .Language.Lang | default "en" }}">

  {{ partial "head.html" . }}

  <body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100{{ if .IsHome }} home{{ end }}{{ if eq .Type "page" }} about-page{{ end }}">

    {{ block "header" . }}{{ partial "header.html" . }}{{ end }}

    <main class="flex-grow">
      {{ block "main" . }}{{ end }}
    </main>

    {{ block "footer" . }}{{ partial "footer.html" . }}{{ end }}
    
    <script>
      // Bloquear eventos de descarga en TODA la página
      document.addEventListener('DOMContentLoaded', () => {
        // Bloquear dragstart globalmente
        document.addEventListener('dragstart', (e) => {
          if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
          }
        }, { capture: true });
    
        // Bloquear contextmenu globalmente
        document.addEventListener('contextmenu', (e) => {
          if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
          }
        }, { capture: true });
    
        // Bloquear doble/triple click en galería
        const galleries = document.querySelectorAll('#gallery');
        galleries.forEach(gallery => {
          gallery.addEventListener('dblclick', (e) => {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }, { capture: true });
    
          gallery.addEventListener('mousedown', (e) => {
            if (e.button === 1 || e.getModifierState("AltGraph")) {
              e.preventDefault();
              return false;
            }
          }, { capture: true });
    
          // Bloquear gestures Mac trackpad
          gallery.addEventListener('gesturestart', e => e.preventDefault());
          gallery.addEventListener('gesturechange', e => e.preventDefault());
          gallery.addEventListener('gestureend', e => e.preventDefault());
        });
      });
    </script>

  </body>
</html>
