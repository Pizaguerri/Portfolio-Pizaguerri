{{/* layouts/partials/header.html */}}
<header>
  <div class="header-container">
    
    {{/* LOGO */}}
    <a class="logo-link" href="{{ .Site.Home.RelPermalink }}">
      <img src="/images/profilepic.png"
           alt="{{ .Site.Title }} logo"
           class="site-logo"
           width="40"
           height="40"
           loading="lazy">
      <span class="site-title">{{ .Site.Title }}</span>
    </a>

    {{/* MENÚ DESKTOP */}}
    {{ if site.Menus.main }}
      <nav class="main-nav">
        <ul>
          {{ range site.Menus.main }}
            <li>
              <a href="{{ .URL }}">{{ .Name }}</a>
            </li>
          {{ end }}
        </ul>
      </nav>
