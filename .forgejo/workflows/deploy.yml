name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: codeberg-medium
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Hugo
        run: |
          wget https://github.com/gohugoio/hugo/releases/download/v0.148.2/hugo_extended_0.148.2_Linux-64bit.tar.gz
          tar -xzf hugo_extended_0.148.2_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Build site
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="portfoliopizaguerricodeberg"
          echo "📦 Building manifest..."
          
          # Build proper manifest with all files and their hashes
          MANIFEST="{}"
          cd public
          for f in $(find . -type f | sed 's|^\./||'); do
            HASH=$(sha256sum "$f" | awk '{print $1}')
            MANIFEST=$(echo "$MANIFEST" | jq --arg key "/$f" --arg val "$HASH" '. + {($key): $val}')
          done
          cd ..
          
          echo "📦 Creating deployment..."
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"branch\":\"main\",\"manifest\":$MANIFEST}")
          
          echo "$RESPONSE" | jq .
          
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.result.id')
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.result.upload_url')
          
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "❌ Failed to create deployment"
            exit 1
          fi
          
          echo "📤 Uploading site..."
          cd public
          tar -czf /tmp/site.tar.gz .
          curl -s -X POST "$UPLOAD_URL" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "file=@/tmp/site.tar.gz"
          
          echo ""
          echo "✅ Deployment uploaded!"
          echo "   View at: https://$PROJECT.pages.dev"