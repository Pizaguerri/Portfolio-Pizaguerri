name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: codeberg-medium
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Hugo
        run: |
          wget https://github.com/gohugoio/hugo/releases/download/v0.148.2/hugo_extended_0.148.2_Linux-64bit.tar.gz
          tar -xzf hugo_extended_0.148.2_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Build site
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="portfoliopizaguerricodeberg"
          echo "📦 Creating deployment..."
          
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}')
          
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.result.id')
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.result.upload_url')
          
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "❌ Failed to create deployment"
            echo "$RESPONSE"
            exit 1
          fi
          
          echo "📤 Uploading files..."
          cd public
          find . -type f | while read -r file; do
            filepath="${file#./}"
            curl -s -X POST "$UPLOAD_URL" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -F "file=@$filepath;filename=$filepath"
          done
          
          echo ""
          echo "✅ Deployment complete!"
          echo "   https://$PROJECT.pages.dev"