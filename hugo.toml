# ------------------------------------------------------------
# 1️⃣  CONFIGURACIÓN BÁSICA DE HUGO
# ------------------------------------------------------------
baseURL                 = "https://www.pabloizaguerri.com"
title                   = "Pablo Izaguerri"
languageCode            = "es"
defaultContentLanguage  = "es"

# Tema que utilizas
theme = "gallery"

[build]
  publishResources = false

[imaging]
  quality = 75
  resampleFilter = "lanczos"


# ------------------------------------------------------------
# 2️⃣  MARKUP (Goldmark – motor de Markdown)
# ------------------------------------------------------------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true                     # permite HTML crudo en los .md

    [markup.goldmark.extensions]
      definitionList = true
      footnote       = true
      linkify        = true
      strikethrough  = true
      table          = true
      taskList       = true
      typographer    = true
      attribute      = true


# ------------------------------------------------------------
# 3️⃣  PARÁMETROS DEL SITIO
# ------------------------------------------------------------
[params]
  description = "Antropología visual y fotografía documental"
  logo        = "/images/profilepic.png"

  # ---- Autor ----
  [params.author]
    name  = "Pablo Izaguerri"
    email = "pablo@example.com"

  # ---- Assets personalizados (CSS, JS, etc.) ----
  [params.assets]
    customCSS = ["css/custom.css"]   # tu hoja custom.css

  # ---- Configuración de la galería (tema Gallery) ----
  [params.gallery]
    lightbox_download = false       # desactiva el botón de descarga en Lightbox

  # ---- Redes sociales / contactos ----
  [params.socialIcons]
    instagram = "https://www.instagram.com/"
    github    = "https://github.com/nicokaiser/hugo-theme-gallery/"
    youtube   = "https://www.youtube.com/"
    email     = "mailto:user@example.com"


# ------------------------------------------------------------
# 4️⃣  MENÚ PRINCIPAL
# ------------------------------------------------------------
[menu]

  [[menu.main]]
    name   = "Proyectos"
    url    = "/proyectos/"
    weight = 1

  [[menu.main]]
    name   = "Blog"
    url    = "/blog/"
    weight = 2

  [[menu.main]]
    name   = "Sobre mí"
    url    = "/about/"
    weight = 3